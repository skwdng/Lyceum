server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  web:
    resources:
      cache:
        period: 0
  application:
    name: siyige
  datasource:
    url: jdbc:h2:mem:siyige;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath:schema-community.sql,classpath:schema-video.sql,classpath:schema-auth.sql,classpath:schema-admin.sql,classpath:schema-security.sql,classpath:schema-pay.sql,classpath:schema-userllm.sql,classpath:schema-notify.sql,classpath:schema-ai.sql,classpath:schema-social.sql,classpath:schema-analytics.sql
  mvc:
    async:
      request-timeout: 1800000
  # Redis 是社区的必需依赖（D7）：浏览去重 view:seen:{postId}:{yyyyMMdd} + 增量 view:pending。
  # 已移除 autoconfigure.exclude 的 RedisAutoConfiguration；启动时做一次 PING 自检
  # （CommunityRedisPing：失败打 ERROR 但**不阻塞启动**，R-COM-37 要求浏览接口一律 204）。
  # 本机实例：Docker 容器 `siyige-redis`（redis:7-alpine，127.0.0.1:6379，独立实例，不与其它项目共用）。
  # 换实例/换密码只需改环境变量 SIYIGE_REDIS_HOST / SIYIGE_REDIS_PORT / SIYIGE_REDIS_PASSWORD，不用动这里。
  data:
    redis:
      host: ${SIYIGE_REDIS_HOST:127.0.0.1}
      port: ${SIYIGE_REDIS_PORT:6379}
      password: ${SIYIGE_REDIS_PASSWORD:siyige123456}
      timeout: 50ms
      connect-timeout: 50ms

siyige:
  # 演示用：把真实时长压缩到 1/20，方便看到 12 步推进
  pace:
    time-scale: 0.05          # 真实环境设 1.0
    turn-seconds: 300         # 每个发言环节的时长（秒），300 = 5 分钟
    ai-think-ms: 700
    ai-delay-scale: 1.0       # AI 回应间隔 10-15 秒，不随 time-scale 压缩         # AI 回合的“思考”下限（会被 time-scale 缩放）
  audit:
    # 关闭时走纯规则审核；打开需要配 llm
    llm-enabled: false
  # 充值计费
  ai-tier:
    tiers:
      basic:
        enabled: ${SIYIGE_BASIC_ENABLED:false}
        base-url: ${SIYIGE_BASIC_BASE_URL:http://127.0.0.1:11434/v1}
        model: ${SIYIGE_BASIC_MODEL:qwen2.5:7b}
        api-key: ${SIYIGE_BASIC_KEY:ollama}
  billing:
    cents-per-1k-tokens: 3      # 每千 token 收 3 分（0.03 元）
    service-fee-cents: 30       # 每场服务费 30 分（0.30 元）
    estimate-tokens: 9000       # 开局预扣按 9000 token 预估
    welcome-grant-cents: 100    # 新用户送 1 元
    pay-secret: dev-secret-change-me   # 回调签名密钥，上线必须换
  video:
    audit:
      # 机器初审通过后是否仍进人工队列（true=更严；false=机器过了就直接上线）
      pass-requires-review: ${SIYIGE_VIDEO_PASS_REVIEW:true}
      reject-words: 涉政敏感,色情,赌博,毒品,代考,枪,炸弹
      review-words: 打架,骂战,人身攻击,盗版,搬运,洗稿
      title-min: 4
      title-max: 60
      allow-local-upload: true
      # 人工审核台：等管理端（admin）接入后再打开，避免任何登录用户给自己过审
      console-enabled: true
  llm:
    base-url: https://api.deepseek.com/v1
    api-key: ""
    model: deepseek-chat
  hot:
    decay-per-10min: 0.5

logging:
  level:
    com.siyige: INFO
