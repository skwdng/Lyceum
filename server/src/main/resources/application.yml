server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  web:
    resources:
      cache:
        period: 0
  application:
    name: siyige
  # ==========================================================================
  # 默认数据源：MySQL 8（2026-11-28 起，切库完成）
  #
  # 为什么默认就是 MySQL：生产早就用 systemd 注入 --spring.profiles.active=mysql 切过去了，
  # 而仓库默认这里还写着 H2，结果「本地跑的和线上跑的不是一套库」。现在统一成 MySQL，
  # 起服务不用再加任何参数。
  #
  # H2 没消失，它退化成**单测专用**：src/test/resources/application-test.yml 把 828 个用例
  # 钉回 H2（test/application.properties 里写了 spring.profiles.active=test）。
  # 那 16 个 schema-*.sql 也只有单测在用（SchemaParityTest 拿它们跟 MySQL 那份比对）。
  #
  # 换库只改环境变量：SIYIGE_DB_URL / SIYIGE_DB_USER / SIYIGE_DB_PASSWORD
  # ==========================================================================
  datasource:
    url: ${SIYIGE_DB_URL:jdbc:mysql://127.0.0.1:3308/siyige?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=%2B08:00&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SIYIGE_DB_USER:root}
    password: ${SIYIGE_DB_PASSWORD:siyige123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 时区：MySQL 的 timestamp 按**会话时区**换算，钉成 +08:00 才和应用写入的本地时间是同一个时钟。
      # 用数字偏移而不是 Asia/Shanghai —— 服务器上不一定装有 MySQL 时区表，命名时区会 SET 失败。
      connection-init-sql: "SET time_zone = '+08:00'"
  sql:
    init:
      mode: always
      # 建表失败要立刻停：否则后面全是「表不存在」的连锁报错，反而难查。
      continue-on-error: false
      # MySQL 只有这一份全量 DDL（42 张表，全部 create table if not exists，可重复执行）。
      # 那 16 个 schema-*.sql 是 H2 方言（identity 列 / create index if not exists），MySQL 下会语法错。
      schema-locations: classpath:schema-mysql-full.sql
  mvc:
    async:
      request-timeout: 1800000
  # Redis 是社区的必需依赖（D7）：浏览去重 view:seen:{postId}:{yyyyMMdd} + 增量 view:pending。
  # 已移除 autoconfigure.exclude 的 RedisAutoConfiguration；启动时做一次 PING 自检
  # （CommunityRedisPing：失败打 ERROR 但**不阻塞启动**，R-COM-37 要求浏览接口一律 204）。
  # 本机实例：Docker 容器 `siyige-redis`（redis:7-alpine，127.0.0.1:6379，独立实例，不与其它项目共用）。
  # 换实例/换密码只需改环境变量 SIYIGE_REDIS_HOST / SIYIGE_REDIS_PORT / SIYIGE_REDIS_PASSWORD，不用动这里。
  data:
    redis:
      host: ${SIYIGE_REDIS_HOST:127.0.0.1}
      port: ${SIYIGE_REDIS_PORT:6379}
      password: ${SIYIGE_REDIS_PASSWORD:siyige123456}
      timeout: 50ms
      connect-timeout: 50ms

siyige:
  # 管理员初始账号：**默认关闭**。生产绝不能开（会用已知密码建超管）。
  # 本地要在新库上要一个管理员时：SIYIGE_ADMIN_SEED=true SIYIGE_ADMIN_PASSWORD=<8位以上> 起服务。
  admin:
    seed:
      enabled: ${SIYIGE_ADMIN_SEED:false}
      account: ${SIYIGE_ADMIN_ACCOUNT:admin}
      password: ${SIYIGE_ADMIN_PASSWORD:}
  # 演示用：把真实时长压缩到 1/20，方便看到 12 步推进
  pace:
    time-scale: 0.05          # 真实环境设 1.0
    turn-seconds: 300         # 每个发言环节的时长（秒），300 = 5 分钟
    ai-think-ms: 700
    ai-delay-scale: 1.0       # AI 回应间隔 10-15 秒，不随 time-scale 压缩         # AI 回合的“思考”下限（会被 time-scale 缩放）
  # 注：原来的 siyige.audit.llm-enabled 已删除 —— 全项目没有任何代码读它（死配置，2026-11-23 全仓 grep 确认），
  # 机器初审一直是纯规则审核（MachineAuditService），要接模型应改那里，而不是靠这个开关。
  # 充值计费
  ai-tier:
    tiers:
      basic:
        enabled: ${SIYIGE_BASIC_ENABLED:false}
        base-url: ${SIYIGE_BASIC_BASE_URL:http://127.0.0.1:11434/v1}
        model: ${SIYIGE_BASIC_MODEL:qwen2.5:7b}
        api-key: ${SIYIGE_BASIC_KEY:ollama}
  billing:
    cents-per-1k-tokens: 3      # 每千 token 收 3 分（0.03 元）
    service-fee-cents: 30       # 每场服务费 30 分（0.30 元）
    estimate-tokens: 9000       # 开局预扣按 9000 token 预估
    welcome-grant-cents: 100    # 新用户送 1 元
    pay-secret: dev-secret-change-me   # 回调签名密钥，上线必须换
  video:
    audit:
      # ⚠️ 原来这里还有 pass-requires-review / title-min / title-max / allow-local-upload 四个键，
      # 自 2026-11-23 参数管理第三批起**已搬进后台参数**（管理台「系统 → 参数管理」→「审核」组），
      # 因此从 yml 删除 —— 留在这里会变成"改了不生效"的第二个真相。
      # 词表仍然只在这里（参数表不收词表：改一个词要改整串、还要重启解析）
      reject-words: 涉政敏感,色情,赌博,毒品,代考,枪,炸弹
      review-words: 打架,骂战,人身攻击,盗版,搬运,洗稿
      # 人工审核台：等管理端（admin）接入后再打开，避免任何登录用户给自己过审
      console-enabled: true
  llm:
    base-url: https://api.deepseek.com/v1
    api-key: ""
    model: deepseek-chat
  # 注：原来的 siyige.hot.decay-per-10min 已删除 —— 全项目没有任何代码读它（死配置），
  # 热度排行目前用 HotRank 的固定公式。等热度算法真的需要可调时，再按参数管理的方式登记。

logging:
  level:
    com.siyige: INFO
