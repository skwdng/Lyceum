<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思弈阁 · 管理后台</title>
<!--
  独立管理页（决策 D5）：不加载 core.js / 不引入 SPA，一套轻量逻辑自己跑。
  入口：/admin（AdminPageController 转发到本文件）
  令牌：localStorage['sy_admin_jwt']，与用户令牌完全隔离
-->
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#F5F6F8;color:#1D2129;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EEF2FF,#F7F8FA)}
  .login-card{width:360px;background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 12px 40px rgba(20,30,60,.10)}
  .login-card h1{margin:0 0 6px;font-size:20px}
  .login-card p{margin:0 0 22px;color:#86909C;font-size:12.5px}
  label{display:block;font-size:12.5px;color:#4E5969;margin:14px 0 6px}
  input,select,textarea{width:100%;border:1px solid #E5E6EB;border-radius:9px;padding:10px 12px;font:inherit;background:#FCFCFD;outline:none}
  input:focus,textarea:focus,select:focus{border-color:#165DFF;box-shadow:0 0 0 3px rgba(22,93,255,.10)}
  .btn{border:1px solid #E5E6EB;background:#fff;color:#1D2129;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#F7F8FA}
  .btn.primary{background:#165DFF;border-color:#165DFF;color:#fff}
  .btn.primary:hover{background:#0E42D2}
  .btn.danger{background:#F53F3F;border-color:#F53F3F;color:#fff}
  .btn.warn{background:#FF7D00;border-color:#FF7D00;color:#fff}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.block{width:100%;justify-content:center;display:block;margin-top:22px;padding:11px}
  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #E5E6EB;padding:0 24px}
  .bar{display:flex;align-items:center;gap:18px;height:60px;max-width:1240px;margin:0 auto}
  .brand{font-weight:700;font-size:16px}
  .tabs{display:flex;gap:6px}
  .tabs button{border:none;background:transparent;padding:8px 14px;border-radius:9px;font-size:13.5px;color:#4E5969;cursor:pointer}
  .tabs button.on{background:#E8F3FF;color:#165DFF;font-weight:600}
  .spacer{flex:1}
  main{max-width:1240px;margin:0 auto;padding:20px 24px 60px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
  .card{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid #EFF0F1}
  .card .k{font-size:12.5px;color:#86909C}
  .card .v{font-size:26px;font-weight:700;margin-top:4px}
  .panel{background:#fff;border-radius:12px;border:1px solid #EFF0F1;overflow:hidden}
  .panel h2{margin:0;padding:14px 18px;font-size:14px;border-bottom:1px solid #EFF0F1;display:flex;gap:10px;align-items:center}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 18px;font-size:13px;border-bottom:1px solid #F2F3F5;vertical-align:top}
  th{color:#86909C;font-weight:500;background:#FAFBFC}
  tr:hover td{background:#FCFCFD}
  .tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;background:#F2F3F5;color:#4E5969;white-space:nowrap}
  .tag.red{background:#FFECE8;color:#F53F3F}
  .tag.ok{background:#E8FFEA;color:#00B42A}
  .tag.orange{background:#FFF7E8;color:#B8740A}
  .tag.blue{background:#E8F3FF;color:#165DFF}
  .muted{color:#86909C}
  .mask{position:fixed;inset:0;background:rgba(20,25,40,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
  .modal{background:#fff;border-radius:14px;width:720px;max-width:100%;max-height:88vh;display:flex;flex-direction:column}
  .modal h3{margin:0;padding:16px 20px;border-bottom:1px solid #EFF0F1;font-size:15px}
  .modal .body{padding:16px 20px;overflow:auto}
  .modal .foot{padding:14px 20px;border-top:1px solid #EFF0F1;display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
  .kv{display:flex;gap:10px;font-size:13px;margin-bottom:8px}
  .kv .k{color:#86909C;min-width:64px}
  pre.content{white-space:pre-wrap;word-break:break-word;background:#FAFBFC;border:1px solid #EFF0F1;border-radius:10px;padding:12px 14px;font-size:13px;max-height:240px;overflow:auto;margin:8px 0 0}
  .rlist{margin-top:14px;border-top:1px dashed #E5E6EB;padding-top:10px}
  .rlist .it{padding:8px 0;border-bottom:1px solid #F7F8FA;font-size:12.5px}
  #toastHost{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:rgba(29,33,41,.92);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;animation:fi .18s}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .field-row{display:flex;gap:10px;align-items:center}
  .field-row select{width:110px}
  @media (max-width:860px){
    .cards{grid-template-columns:1fr}
    .bar{gap:10px;height:auto;padding:10px 0;flex-wrap:wrap}
    th,td{padding:9px 12px}
    main{padding:14px 12px 60px}
  }
/* 迁移期入口：新版管理台（Vue）。与旧主站侧栏的「试用新版」同一个意思，
   点过去是 /siyige/v2/index.html#/admin（相对路径，带不带 /siyige 前缀都能用）。
   只在登录页和页头各放一个，旧管理台本身不受影响。 */
.v2-entry{display:inline-block;color:#2F5BEA;background:#EDF1FE;border-radius:8px;
  padding:6px 12px;font-size:12px;text-decoration:none}
.v2-entry:hover{background:#E3EAFD}
.v2-entry.blockly{display:block;text-align:center;margin-top:14px}
</style>
</head>
<body>

<!-- 登录 -->
<div class="login-wrap" id="loginView">
  <form class="login-card" onsubmit="adminLogin(event)">
    <h1>思弈阁 · 管理后台</h1>
    <p>管理员账号独立于普通用户，请用管理账号登录。</p>
    <label for="acc">账号</label>
    <input id="acc" autocomplete="username" placeholder="admin">
    <label for="pwd">密码</label>
    <input id="pwd" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn primary block" type="submit" id="loginBtn">登录</button>
    <a class="v2-entry blockly" href="v2/index.html#/admin" title="新版管理台（Vue）">试用新版管理台 →</a>
  </form>
</div>

<!-- 主体 -->
<div id="appView" style="display:none">
  <header>
    <div class="bar">
      <div class="brand">思弈阁 · 管理后台</div>
      <div class="tabs">
        <button id="tabReports" class="on" onclick="adminTab('reports')">举报队列</button>
        <button id="tabUsers" onclick="adminTab('users')">用户管理</button>
        <button id="tabAudit" onclick="adminTab('audit')">处理记录</button>
      </div>
      <div class="spacer"></div>
      <span class="muted" style="font-size:12.5px" id="adminWho"></span>
      <button class="btn sm" onclick="adminOpenPassword()">修改密码</button>
      <button class="btn sm" onclick="adminLogout()">退出登录</button>
      <a class="v2-entry" href="v2/index.html#/admin" title="新版管理台（Vue）">试用新版 →</a>
    </div>
  </header>

  <main>
    <div class="cards">
      <div class="card"><div class="k">待处理举报</div><div class="v" id="stPending">-</div></div>
      <div class="card"><div class="k">今日新增</div><div class="v" id="stToday">-</div></div>
      <div class="card"><div class="k">禁言中用户</div><div class="v" id="stBanned">-</div></div>
    </div>

    <div class="panel" id="reportsPanel">
      <h2>举报队列 <span class="muted" style="font-weight:400">按目标聚合 · 举报人数多的在前</span></h2>
      <div id="reportsBody"><div class="muted" style="padding:20px">加载中…</div></div>
    </div>

    <div class="panel" id="auditPanel" style="display:none">
      <h2>处理记录 <span class="muted" style="font-weight:400">谁对被举报内容做了什么 · 可撤销删除</span></h2>
      <div id="auditBody"><div class="muted" style="padding:20px">加载中…</div></div>
    </div>

    <div class="panel" id="usersPanel" style="display:none">
      <h2>
        用户管理
        <input id="userQ" placeholder="搜索账号或昵称" style="width:220px;margin-left:auto"
               onkeydown="if(event.key==='Enter')adminSearchUsers()">
        <button class="btn sm" onclick="adminSearchUsers()">搜索</button>
      </h2>
      <div id="usersBody"><div class="muted" style="padding:20px">加载中…</div></div>
    </div>
  </main>
</div>

<div id="modalHost"></div>
<div id="toastHost"></div>
<script src="/js/admin.js"></script>
</body>
</html>
