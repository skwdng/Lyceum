<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>思弈阁 · AI 辩论训练</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#1A1D24;--sub:#6B7280;--line:#E6E3DC;--bg:#F6F4EF;--card:#fff;
        --blue:#2F5BEA;--blue-w:#EDF1FE;--org:#C2671E;--org-w:#FDF0E6;
        --grn:#0E9F6E;--grn-w:#E8F8F2;--red:#C0392B;--red-w:#FDECEA}
  body{font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  button{font:inherit;border:none;cursor:pointer;background:none;color:inherit}
  input,textarea,select{font:inherit;color:inherit}
  .app{display:flex;min-height:100vh}
  .sb{width:196px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:9px;padding:0 8px 16px}
  .logo .m{width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .logo b{font-size:15px;letter-spacing:.5px}.logo span{font-size:10px;color:var(--sub);display:block;line-height:1}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:#4A5568;font-size:13px;cursor:pointer}
  .nav a:hover{background:#F6F4EF}
  .nav a.on{background:var(--blue-w);color:var(--blue);font-weight:600}
  .nav .g{font-size:10.5px;color:#A8ADB8;padding:12px 10px 4px;letter-spacing:.5px}
  .sb .me{margin-top:auto;display:flex;align-items:center;gap:8px;padding:9px 10px;border-top:1px solid var(--line);font-size:12.5px}
  .sb .me .av{width:26px;height:26px;border-radius:7px;background:#2A2F3A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
  main{flex:1;min-width:0;padding:24px 28px 60px}
  h1.pg{font-size:20px;margin-bottom:4px}
  p.sub{font-size:12.5px;color:var(--sub);margin-bottom:18px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border-radius:9px;padding:9px 16px;font-size:13.5px;border:1px solid transparent}
  .btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:#244BCF}
  .btn.ghost{background:#fff;border-color:var(--line);color:#4A5568}.btn.ghost:hover{border-color:#9DB4F5;color:var(--blue)}
  .btn.sm{padding:5px 11px;font-size:12px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 320px}.g3{grid-template-columns:repeat(3,1fr)}
  .gauto{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .tag{font-size:11px;padding:2px 8px;border-radius:5px;background:#F1EFE9;color:#6B7280;display:inline-block}
  .tag.b{background:var(--blue-w);color:var(--blue)}.tag.o{background:var(--org-w);color:var(--org)}
  .tag.g{background:var(--grn-w);color:var(--grn)}.tag.r{background:var(--red-w);color:var(--red)}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th{text-align:left;font-weight:600;color:var(--sub);font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
  table.t td{padding:9px 6px;border-bottom:1px solid #F3F1EB}table.t tr:last-child td{border-bottom:none}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .topic{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s}
  .topic:hover{border-color:#9DB4F5;box-shadow:0 8px 22px rgba(47,91,234,.1);transform:translateY(-2px)}
  .topic h3{font-size:14.5px;line-height:1.5;margin-bottom:9px;min-height:44px}
  .topic .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:10px}
  .topic .go{color:var(--blue);font-weight:600}
  .hot{display:flex;flex-direction:column;gap:6px}
  .hitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;background:#FBFAF7;cursor:pointer}
  .hitem:hover{background:#fff;box-shadow:0 4px 14px rgba(47,91,234,.08)}
  .hitem .rk{width:22px;height:22px;border-radius:6px;background:#F1EFE9;color:#6B7280;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .hitem.top1 .rk{background:#FFF3D6;color:#B7791F}
  .hitem .tt{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hitem .sc{font:12px ui-monospace,monospace;color:var(--blue);font-weight:600}
  .heatbar{height:4px;background:#F1EFE9;border-radius:3px;overflow:hidden;margin-top:6px}
  .heatbar i{display:block;height:100%;background:linear-gradient(90deg,#2F5BEA,#7C97FF)}
  .strip{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
  .sp{display:flex;gap:6px;align-items:center;padding:5px 9px;border-radius:8px;background:#F6F4EF;flex-shrink:0;border:1px solid transparent}
  .sp.me{background:var(--blue-w);border-color:#B9C9F7}.sp.cur{box-shadow:0 0 0 2px var(--blue) inset}
  .sp .av{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
  .sp .av.a{background:var(--blue)}.sp .av.b{background:var(--org)}
  .sp .nm{font-size:11.5px;font-weight:600;line-height:1.2}.sp .rl{font-size:10px;color:var(--sub);line-height:1.2}
  .stage{display:grid;grid-template-columns:1fr 288px;gap:14px}
  .chat{background:#FBFAF7;border:1px solid var(--line);border-radius:12px;height:460px;overflow-y:auto;padding:16px}
  .msg{display:flex;gap:9px;margin-bottom:13px;animation:in .2s ease}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg.b{flex-direction:row-reverse}
  .msg .ava{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
  .msg .ava.a{background:var(--blue)}.msg .ava.b{background:var(--org)}.msg .ava.me{background:#2A2F3A}
  .msg .bd{max-width:76%}.msg.b .bd{text-align:right}
  .msg .hd{font-size:11px;color:var(--sub);margin-bottom:3px;display:flex;gap:6px}
  .msg.b .hd{justify-content:flex-end}.msg .hd b{color:#3A4150}
  .bub{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13.5px;line-height:1.75;display:inline-block;text-align:left;white-space:pre-wrap}
  .msg.me .bub{background:#2A2F3A;color:#fff;border-color:#2A2F3A}
  .msg.b:not(.me) .bub{background:#FFF8F2;border-color:#F3DFCC}
  .sys{text-align:center;margin:9px 0 13px}
  .sys span{font-size:11.5px;color:var(--sub);background:#fff;border:1px dashed var(--line);border-radius:6px;padding:4px 12px}
  .composer{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
  .composer .hint{font-size:11.5px;color:var(--sub);margin-bottom:8px;display:flex;justify-content:space-between}
  .composer textarea{width:100%;min-height:66px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;background:#FCFBF8}
  .composer textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,91,234,.1)}
  .waiting{text-align:center;padding:14px;color:var(--sub);font-size:13px}
  .steps{font-size:12px;max-height:230px;overflow:auto}
  .st{display:flex;gap:8px;padding:3px 0;color:#8A909C}
  .st .no{width:16px;text-align:right;font-family:ui-monospace,monospace;font-size:11px}
  .st.done{color:#4A5568}.st.cur{color:var(--blue);font-weight:600}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:#4A5568}.kv b{color:var(--ink)}
  .big{font-size:48px;font-weight:800;letter-spacing:-2px;line-height:1}.big small{font-size:13px;font-weight:500;color:var(--sub);letter-spacing:0}
  .dim{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:6px 0}
  .dim .lb{width:40px;color:#4A5568}
  .dim .dbar{flex:1;height:6px;background:#F1EFE9;border-radius:4px;overflow:hidden}
  .dim .dbar i{display:block;height:100%;background:var(--blue);border-radius:4px}
  .ev{background:#FBFAF7;border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.85;margin-top:14px}
  .ev .k{color:var(--sub);font-size:11.5px;margin-bottom:2px}
  .mask{position:fixed;inset:0;background:rgba(20,22,28,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
  .panel{background:#fff;border-radius:16px;width:min(760px,100%);padding:22px;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.2)}
  .panel h2{font-size:17px;margin-bottom:6px}.panel .desc{font-size:12.5px;color:var(--sub);margin-bottom:16px}
  .seats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .seat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .seat{border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center;cursor:pointer;background:#FCFBF8}
  .seat:hover{border-color:#9DB4F5}
  .seat.on{background:var(--blue-w);border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,91,234,.12)}
  .seat .k{font:10.5px ui-monospace,monospace;color:var(--sub)}.seat .r{font-size:12.5px;font-weight:600}.seat .n{font-size:10.5px;color:var(--sub)}
  .presets{display:flex;gap:7px;margin:14px 0 2px;flex-wrap:wrap}
  .preset{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--sub)}
  .preset:hover{border-color:var(--blue);color:var(--blue)}
  .sum{margin-top:14px;background:#FBFAF7;border:1px dashed var(--line);border-radius:9px;padding:11px 13px;font-size:12.5px}
  .sum b{color:var(--blue)}
  #toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
  .tst{background:#20242C;color:#fff;border-radius:8px;padding:9px 16px;font-size:13px;box-shadow:0 8px 22px rgba(0,0,0,.2)}
  .codebox{background:#1E222B;color:#D6DEEB;border-radius:9px;padding:12px 14px;font:12px/1.8 ui-monospace,monospace;overflow:auto;white-space:pre}
  .codebox .c{color:#7A869A}.codebox .k{color:#8FB8FF}
  .empty{color:#A8ADB8;font-size:12.5px;padding:22px 0;text-align:center}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--grn);display:inline-block;margin-right:5px}
  /* ================= 手机端适配 ================= */
  @media (max-width: 860px){
    body{font-size:15px}
    .app{display:block}
    .sb{
      position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;
      flex-direction:row;align-items:center;gap:4px;padding:6px 8px;
      border-right:none;border-top:1px solid var(--line);z-index:70;
      overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    }
    .sb .logo{display:none}
    .sb .me{display:none}
    .nav{flex-direction:row;gap:2px}
    .nav .g{display:none}
    .nav a{white-space:nowrap;padding:9px 12px;font-size:13.5px;border-radius:10px}
    main{padding:14px 14px 96px}
    h1.pg{font-size:18px}
    p.sub{font-size:12.5px;margin-bottom:14px}

    .grid.g2,.grid.g3,.grid.gauto{grid-template-columns:1fr}
    .stage{grid-template-columns:1fr}
    .seats{grid-template-columns:1fr}
    .seat-grid{grid-template-columns:repeat(4,1fr)}

    .row{gap:8px}
    .btn{padding:11px 16px;min-height:42px}
    .btn.sm{padding:9px 13px;min-height:38px}

    .topic h3{min-height:0;font-size:15px}
    .chat{height:56vh}
    .composer{position:sticky;bottom:76px;z-index:60;background:#fff;box-shadow:0 -6px 14px rgba(0,0,0,.06)}
    .msg .bd{max-width:86%}
    .bub{font-size:14.5px}

    .panel{width:100%;max-height:90vh;padding:18px;border-radius:14px}
    .mask{align-items:flex-end;padding:0}
    .panel{border-bottom-left-radius:0;border-bottom-right-radius:0}

    .strip{padding:8px}
    .sp{padding:6px 10px}
    .steps{max-height:none}
    .codebox{font-size:11px}
    .big{font-size:40px}
  }

  @media (max-width: 480px){
    .seat-grid{grid-template-columns:repeat(2,1fr)}
    .chat{height:52vh}
    .nav a{padding:8px 10px;font-size:12.5px}
    main{padding:12px 12px 92px}
  }

  /* 排队等待打字的气泡：显示省略号，别让它看起来是空的 */
  .bub .pending{color:#B9BEC8}

</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="logo"><div class="m">思</div><div><b>思弈阁</b><span>AI 辩论训练</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><div class="av">演</div><div><div>演示用户</div><div style="font-size:11px;color:#A8ADB8" id="meSub">连接中…</div></div></div>
  </aside>
  <main id="main"><div class="empty">正在连接后端…</div></main>
</div>
<div id="modalHost"></div>
<div id="toast"></div>

<script>
/* ============ 基础 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = s => { s = Math.max(0, s|0); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
function toast(msg){ const d=document.createElement('div'); d.className='tst'; d.textContent=msg; $('#toast').appendChild(d); setTimeout(()=>d.remove(),2200); }

const API_BASE = location.pathname.indexOf('/siyige') === 0 ? '/siyige' : '';

async function api(path, opts){
  const o = opts || {};
  const r = await fetch(API_BASE + path, {
    method: o.method || 'GET',
    headers: o.body ? {'Content-Type':'application/json'} : {},
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  const text = await r.text();
  if (!r.ok) throw new Error(text || ('HTTP ' + r.status));
  return text ? JSON.parse(text) : null;
}

/* ============ 状态 ============ */
const S = {
  view:'solo', topics:[], hot:null, diag:null, records:[],
  mySeats: JSON.parse(localStorage.getItem('sy_seats') || '["A1"]'),
  mode:'FULL',
  pace: localStorage.getItem('sy_pace') || 'normal',
  difficulty: localStorage.getItem('sy_diff') || 'pro',
  flawOffer: null, brief: null, briefSide: null, phase: 'STEP', kind: 'solo', unlimited: false,
  userId: localStorage.getItem('sy_uid') || (()=>{ const u='g'+Math.random().toString(36).slice(2,8); localStorage.setItem('sy_uid',u); return u; })(),
  roomCode:null, room:null, mySeat:null, roomMode:false, rooms:[], roomPoll:null,
  cards:[], cardsTopic:null, matchId:null, match:null, turns:[], waiting:false,
  pollTimer:null, es:null, review:null, typed:new Set(), progress:{}, pauseUntil:{}, remaining:0, extendUsed:0, lastKeep:0
};
const persistSeats = () => localStorage.setItem('sy_seats', JSON.stringify(S.mySeats));

/* ============ 启动 ============ */
async function boot(){
  try {
    const [topics, hot, diag, records] = await Promise.all([
      api('/api/topics'), api('/api/hot?n=12'), api('/api/diag?userId=' + S.userId), api('/api/records?userId=' + S.userId)
    ]);
    S.topics = topics; S.hot = hot; S.diag = diag; S.records = records;
    await loadRooms();
    $('#meSub').textContent = `连续练习 ${diag.streak || 1} 天`;
    render();
  } catch (e) {
    $('#main').innerHTML = `<div class="card"><b>连不上后端</b><p class="sub" style="margin:8px 0 0">${esc(e.message)}</p>
      <p style="font-size:12.5px;color:#6B7280;margin-top:8px">确认服务在跑：<span class="mono">http://localhost:8080/api/health</span></p></div>`;
  }
}

/* ============ 路由 ============ */
const NAV = [
  {g:'训练'}, {k:'solo', n:'单人辩论'}, {k:'room', n:'多人辩论'}, {k:'hotb', n:'热辩榜'},
  {g:'我的'}, {k:'diag', n:'能力诊断'}, {k:'records', n:'辩论记录'}, {g:'社区'}, {k:'community', n:'讨论社区'}
];
function reNav(){
  $('#nav').innerHTML = NAV.map(n => n.g ? `<div class="g">${n.g}</div>`
    : `<a class="${S.view===n.k?'on':''}" onclick="go('${n.k}')">${n.n}</a>`).join('');
}
function go(v){
  if (v === 'community') { location.href = '/community.html'; return; }   // 社区是独立页面
  if (S.pollTimer && v !== 'match') { stopPoll(); S.matchId = null; S.match = null; S.roomMode = false; }
  S.view = v; render();
  if (v === 'records' || v === 'diag' || v === 'hotb' || v === 'solo') refreshDash(v);
}

/** 打开这些页面时重新拉一次数据，避免展示开机时的旧缓存 */
async function refreshDash(v){
  try {
    const [hot, diag, records] = await Promise.all([
      api('/api/hot?n=12'), api('/api/diag?userId=' + S.userId), api('/api/records?userId=' + S.userId)
    ]);
    S.hot = hot; S.diag = diag; S.records = records;
    $('#meSub').textContent = `连续练习 ${diag.streak || 1} 天`;
    if (S.view === v) render();
  } catch (e) { /* 忽略，保留旧数据 */ }
}
function render(){
  reNav();
  const v = { solo:viewSolo, room:viewRoom, hotb:viewHot, diag:viewDiag, records:viewRecords,
              match:viewMatch, review:viewReview }[S.view];
  $('#main').innerHTML = v ? v() : viewSolo();
  if (S.view === 'match') {
    renderStrip();
    bindChatScroll();
  }
}

/* ============ 单人辩论 ============ */
function viewSolo(){
  const myTurns = S.topics.length ? null : null;
  return `
  <h1 class="pg">单人辩论</h1>
  <p class="sub">选一道题（或自己填）→ 选位置 → 直接开打。不建房、不等人，缺的席位由 AI 补齐。</p>

  <div class="grid g2" style="margin-bottom:16px">
    <div class="card" style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1;min-width:240px">
        <b style="font-size:13px">自己出一个辩题 <span class="tag b">AI 审核</span></b>
        <div style="font-size:11.5px;color:#8A909C;margin:4px 0 8px">写一句你关心的问题，会先过可辩性审核</div>
        <input id="customTopic" class="btn ghost" style="width:100%;text-align:left;padding:8px 12px"
               placeholder="例如：该不该把 AI 生成内容算作学术不端"
               onkeydown="if(event.key==='Enter')useCustomTopic()">
      </div>
      <button class="btn primary" onclick="useCustomTopic()">用这个题开练</button>
    </div>
    <div class="card">
      <b style="font-size:13px">当前席位</b>
      <div style="font-size:12.5px;color:#4A5568;margin-top:6px;line-height:1.8">
        <b style="color:#2F5BEA">${S.mySeats.join('、')}</b> · 本场发言
        <b style="color:#2F5BEA">${countMyTurns()}</b> 次
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm ghost" onclick="openSeatPanel(null)">改席位</button>
        <select class="btn sm ghost" onchange="S.mode=this.value">
          <option value="FULL" ${S.mode==='FULL'?'selected':''}>全流程 12 步</option>
          <option value="SPRINT" ${S.mode==='SPRINT'?'selected':''}>快速 8 步</option>
        </select>
      </div>
    </div>
  </div>

  <div class="grid g2">
    <div>
      <b style="font-size:13px">题库</b>
      <div class="grid gauto" style="margin-top:10px">
        ${S.topics.map(t => `
          <div class="topic" onclick="openSeatPanel('${t.id}')">
            <h3>${esc(t.title)}</h3>
            <div class="row"><span class="tag">${esc(t.cat)}</span>
              <span class="tag ${t.diff==='竞赛'?'o':t.diff==='进阶'?'b':'g'}">${esc(t.diff)}</span>
              <span class="tag">🔥 ${t.hot}</span></div>

function toggleSeat(k){
  const i = S.mySeats.indexOf(k);
  if (i >= 0) { if (S.mySeats.length === 1) return toast('至少保留一个席位'); S.mySeats.splice(i,1); }
  else S.mySeats.push(k);
  persistSeats(); openSeatPanel(S.pendingTopicId); syncSum();
}
function preset(list){ S.mySeats = list.slice(); persistSeats(); openSeatPanel(S.pendingTopicId); syncSum(); }
function setDifficulty(d){ S.difficulty = d; localStorage.setItem('sy_diff', d); openSeatPanel(S.pendingTopicId); }

function setPace(p){ S.pace = p; localStorage.setItem('sy_pace', p); openSeatPanel(S.pendingTopicId); }

/** 各环节实际秒数（与后端 Pace 表保持一致） */
const PACE_BASE = {立论:300, 驳立论:210, 质询:150, 自由辩:90, 总结:240};
const PACE_FACTOR = {tight:0.6, normal:1.0, loose:1.4};
function paceSec(seg){ return Math.max(45, Math.round((PACE_BASE[seg]||180) * (PACE_FACTOR[S.pace]||1))); }
function paceHint(){
  const f = PACE_FACTOR[S.pace] || 1;
  return Math.round(300*f/60) + ' 分钟 / 自由辩 ' + Math.round(90*f) + ' 秒';
}

function syncSum(){

}
function closeSeat(){ document.querySelectorAll('#seatMask').forEach(m => m.remove()); }
async function startFromPanel(){
  closeSeat();

}

/* ============ 审核 + 开局 ============ */
async function useCustomTopic(){
  const el = $('#customTopic');
  const title = (el?.value || '').trim();
  if (!title) return toast('先写一个辩题');
  showAudit(title, null);
  try {
    const r = await api('/api/topics/audit', {method:'POST', body:{title}});

  } catch (e) { showAudit(title, {result:'ERROR', reason:e.message}); }
}
function showAudit(title, r){
  document.querySelectorAll('#auditMask').forEach(m => m.remove());

    openSeatPanel(null);
    return;
  }
  const m = document.createElement('div');
  m.className = 'mask'; m.id = 'auditMask';

  m.innerHTML = `

}

async function createMatch(body){
  try {
    const payload = Object.assign({userId:S.userId, seats:S.mySeats, mode:S.mode, pace:S.pace, difficulty:S.difficulty}, body);
    if (!payload.topicId && S.pendingTitle) payload.title = S.pendingTitle;
    const r = await api('/api/matches', {method:'POST', body:payload});
    S.matchId = r.matchId; S.pendingTitle = null;
    await loadMatch(true);
    startPoll();
    go('match');
  } catch (e) {
    toast('开局失败：' + e.message);
  }
}

/* ============ 对局 ============ */
function startPoll(){
  stopPoll();
  S.pollTimer = setInterval(() => loadMatch(false), 400);
  openStream();
}

/** SSE：AI 一说完立刻推过来，不用等下一次轮询 */
function openStream(){
  closeStream();
  if (!S.matchId || typeof EventSource === "undefined") return;
  try {
    S.es = new EventSource(API_BASE + "/api/matches/" + S.matchId + "/events");
    S.es.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (d.type === "flaw") {
          S.flawOffer = { step: d.step, options: d.options || [] };
          render();
          toast("对方这轮发言埋了一处漏洞，指出来");
          return;
        }
      } catch (err) {}
      loadMatch(false);
    };
    S.es.onerror = () => { /* 断了就靠轮询兜底 */ };
  } catch (e) {}
}
function closeStream(){ if (S.es) { try { S.es.close(); } catch(e){} S.es = null; } }
function stopPoll(){ if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; } closeStream(); }

async function loadMatch(first){
  if (!S.matchId) return;
  try {
    const d = await api('/api/matches/' + S.matchId);
    const prevCount = S.turns.length;
    S.match = d.match; S.turns = d.turns || [];
    S.remaining = d.remainingSec || 0; S.extendUsed = d.extendUsed || 0; S.phase = d.phase || 'STEP';
    S.kind = d.kind || 'solo'; S.unlimited = !!d.unlimited;
    updateCountdown();
    if (d.match && d.match.topic_id && S.cardsTopic !== d.match.topic_id) {
      try {
        const ev = await api('/api/topics/' + d.match.topic_id + '/evidence');
        S.cards = ev.cards || []; S.cardsTopic = d.match.topic_id;
        if (S.view === 'match') render();          // 论据卡是后到的，要补一次渲染
      } catch (e) { S.cards = []; }
    }
    const prevWaiting = S.waiting, prevPhase = S.phase;
    S.waiting = S.roomMode ? (d.waitingSeat && d.waitingSeat === S.mySeat) : d.waitingForMe;
    // 轮次没变但「轮到我 / 抢拍状态」变了，也要重渲染，否则输入框不出来
    const stateChanged = (prevWaiting !== S.waiting) || (prevPhase !== S.phase);
    if (first || prevCount !== S.turns.length || stateChanged || S.view !== 'match') {
      if (S.view !== 'match') return;
      render();
      const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight;
    } else {
      const hint = $('#cHint'); if (hint) hint.textContent = S.waiting ? '轮到你发言' : '等待对方发言…';
    }
    if (d.match.status !== 'RUNNING') {
      stopPoll();
      const [rev, hot, diag, records] = await Promise.all([
        api('/api/matches/' + S.matchId + '/review'),
        api('/api/hot?n=12'),
        api('/api/diag?userId=' + S.userId),
        api('/api/records?userId=' + S.userId)
      ]);
      S.review = rev; S.hot = hot; S.diag = diag; S.records = records;
      $('#meSub').textContent = `连续练习 ${diag.streak || 1} 天`;
      S.flawOffer = null; S.view = 'review'; render();
    }
  } catch (e) { window.__loadErr = (e && e.message) || String(e); }
}

function chatHTML(){
  if (!S.turns.length) return '<div class="sys"><span>对局开始，等待第一条发言…</span></div>';

  // 找到第一条还没打完的 AI 发言；它后面的先不显示，
  // 否则会出现「上一个人还在打，下一个人已经冒出来」的错觉。
  const keyOf = t => t.step + '|' + t.seat + '|' + (((t.content || '').trim()) || '（这一轮没有说出内容）').length;
  let firstUntyped = -1;
  for (let i = 0; i < S.turns.length; i++) {
    const t = S.turns[i];
    if (S.mySeats.includes(t.seat) || t.status === 'TIMEOUT') continue;
    if (!S.typed.has(keyOf(t))) { firstUntyped = i; break; }
  }
  const list = S.turns.filter((t, idx) =>
    S.mySeats.includes(t.seat) || t.status === 'TIMEOUT' || firstUntyped === -1 || idx <= firstUntyped);

  return list.map(t => {
    const me = S.mySeats.includes(t.seat);
    const side = String(t.seat).startsWith('A') ? 'a' : 'b';
    const timeout = t.status === 'TIMEOUT';
    const text = (t.content || '').trim() || '（这一轮没有说出内容）';
    const key = keyOf(t);

    let body = esc(text), attr = '';
    if (!me && !timeout && !S.typed.has(key)) {
      const prog = S.progress[key] || 0;
      // 还没轮到它打字：显示省略号，避免看着像空壳
      body = prog > 0 ? esc(text.slice(0, prog)) : '<span class="pending">…</span>';
      attr = ' data-key="' + key + '" data-full="' + esc(text) + '"';
    }
    return `<div class="msg ${side} ${me?'me':''}">
      <div class="ava ${me?'me':side}">${me?'我':(String(t.seat).startsWith('A')?'正':'反')}</div>
      <div class="bd"><div class="hd"><b>${me?'你':'AI 辩手'}</b><span>${t.seat}</span><span>·</span><span>${t.seg}</span>
        ${timeout?'<span class="tag r">超时</span>':''}</div>
        <div class="bub"${attr}>${body}</div></div>
    </div>`;
  }).join('');
}

/** 用户往上翻的时候不要抢滚动条 */
function nearBottom(el){
  if (!el) return true;
  return el.scrollHeight - el.scrollTop - el.clientHeight < 60;
}

/**
 * 打字机：全局一个循环，同时推进所有未播完的 AI 气泡。
 * 关键改进：进度存在 S.progress[key]，任何一次重渲染都从这里接着打，
 * 不会因为“来了新消息”而让上一条整段弹出来。
 */
setInterval(function(){
  const nodes = [...document.querySelectorAll('.bub[data-key]')];
  if (!nodes.length) return;
  const now = Date.now();
  const chat = $('#chat');

  // 串行：只推进最靠前的那一条，保证「上一个人说完，下一个才开口」
  let node = null;
  for (const n of nodes) {
    const k = n.getAttribute('data-key');
    if (!k || S.typed.has(k)) continue;
    node = n;
    break;
  }
  if (!node) return;

  const key = node.getAttribute('data-key');
  const full = node.getAttribute('data-full') || '';
  if (!full) { S.typed.add(key); return; }
  if (now < (S.pauseUntil[key] || 0)) return;

  let idx = (S.progress[key] || 0) + 1;
  S.progress[key] = idx;
  node.textContent = full.slice(0, idx);
  if (S.stickBottom !== false && chat) chat.scrollTop = chat.scrollHeight;

  if (idx >= full.length) { S.typed.add(key); return; }

  const ch = full.charAt(idx - 1);
  const per = Math.min(150, Math.max(28, Math.round(11000 / Math.max(1, full.length))));
  let d = per;
  if (ch === '。' || ch === '！' || ch === '？') d = Math.min(800, per * 8);
  else if (ch === '，' || ch === '；' || ch === '：') d = Math.min(380, per * 3);
  else if (ch === '「' || ch === '」') d = Math.round(per * 1.5);
  S.pauseUntil[key] = now + d;
}, 40);

/** 聊天区滚动：用户往上翻就暂停自动跟随，翻回底部再恢复 */
function bindChatScroll(){
  const chat = $('#chat');
  if (!chat || chat.dataset.bound) return;
  chat.dataset.bound = '1';
  chat.addEventListener('scroll', () => {
    S.stickBottom = nearBottom(chat);
    const tip = $('#scrollTip');
    if (tip) tip.style.display = S.stickBottom ? 'none' : 'block';
  });
}


function updateCountdown(){
  const el = $('#cdown');
  if (!el) return;
  if (S.unlimited) {
    el.textContent = S.waiting ? '不限时' : '';
    el.style.color = '#0E9F6E';
    el.style.fontWeight = '600';
    return;
  }
  el.textContent = S.waiting ? fmt(S.remaining) : '';
  el.style.color = S.remaining <= 30 ? '#C0392B' : (S.remaining <= 60 ? '#C2671E' : '#6B7280');
  el.style.fontWeight = S.remaining <= 30 ? '700' : '400';
}
async function onTyping(){
  if (!S.matchId || !S.waiting) return;
  const now = Date.now();
  if (S.remaining > 120) return;
  if (S.extendUsed >= 3) return;
  if (now - S.lastKeep < 15000) return;
  S.lastKeep = now;
  try {
    const r = await api('/api/matches/' + S.matchId + '/keepalive', {method:'POST'});
    if (r && r.extended) {
      S.extendUsed = r.used;
      S.remaining += r.addSec;
      updateCountdown();
      toast('已自动续时 ' + r.addSec + ' 秒（' + r.used + '/' + r.max + '）');
    }
  } catch (e) {}
}

/** 每秒刷一次倒计时；最后 30 秒变红 */
setInterval(function(){
  if (S.view !== 'match' || !S.waiting) return;
  if (S.remaining > 0) { S.remaining -= 1; updateCountdown(); }
}, 1000);

async function buzz(){
  if (!S.matchId) return;
  try {
    const r = await api('/api/matches/' + S.matchId + '/buzz', {method:'POST'});
    if (r && r.ok) {
      // 抢到就立刻拿到话筒：本地先切状态并渲染，不等下一轮轮询
      S.phase = 'STEP';
      S.waiting = true;
      S.remaining = r.seconds || 90;
      S.extendUsed = 0;
      toast('抢到了，你有 ' + r.seconds + ' 秒');
      render();
      await loadMatch(false);
    } else {
      toast((r && r.reason) ? r.reason : '没抢到');
    }
  } catch (e) { toast('抢拍失败：' + e.message); }
}

function radar(dims){
  const keys = Object.keys(dims), n = keys.length, R = 84, cx = 120, cy = 120;
  const pt = (k, i, f) => {
    const a = -Math.PI/2 + i*2*Math.PI/n, r = R*f;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };
  const outer = keys.map((k,i) => pt(k,i,1));
  const pts = keys.map((k,i) => pt(k,i, (dims[k]||0)/100));
  return `<svg viewBox="0 0 240 240" style="width:100%;max-width:320px">
    ${[0.25,0.5,0.75,1].map(f => `<polygon points="${outer.map(([x,y])=>[cx+(x-cx)*f, cy+(y-cy)*f].join(',')).join(' ')}"
       fill="none" stroke="#EDEAE3"/>`).join('')}
    ${outer.map(([x,y]) => `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#EDEAE3"/>`).join('')}
    <polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="rgba(47,91,234,.18)" stroke="#2F5BEA" stroke-width="2"/>
    ${keys.map((k,i) => { const [x,y] = pt(k,i,1.18);
      return `<text x="${x}" y="${y}" font-size="10" fill="#6B7280" text-anchor="middle" dominant-baseline="middle">${k}</text>`; }).join('')}
  </svg>`;
}

      ${rs.map(r => `<tr><td>${esc(r.topic_title)}</td><td class="mono">${esc(r.seats)}</td>
        <td class="mono">${r.turns}</td><td><b>${r.total}</b></td></tr>`).join('')}
    </table>` : '<div class="empty">还没有记录，去单人辩论打一场</div>'}
  </div>`;
}

/* ============ 多人辩论（真接口） ============ */
async function loadRooms(){
  try { S.rooms = await api('/api/rooms'); } catch (e) { S.rooms = []; }
}
function viewRoom(){
  if (!S.roomCode) {
    const list = S.rooms || [];
    return `
    <h1 class="pg">多人辩论</h1>
    <p class="sub">8 席房间：建房 → 把房间号发给队友 → 全员准备 → 房主开局。空位自动补 AI。</p>
    <div class="grid g3" style="max-width:1000px">
      <div class="card">
        <b style="font-size:13px">① 创建房间</b>
        <p style="font-size:12px;color:#8A909C;margin:8px 0 12px">随机抽一道题，你坐 A1，房主免准备。</p>
        <button class="btn primary" style="width:100%" onclick="createRoom()">＋ 建房</button>
      </div>
      <div class="card">
        <b style="font-size:13px">② 房间号加入</b>
        <input id="joinCode" class="btn ghost" style="width:100%;margin:10px 0;text-align:left;padding:8px 12px"
               placeholder="SY-XXXX">
        <button class="btn ghost" style="width:100%" onclick="joinRoom(document.querySelector('#joinCode').value)">加入</button>
      </div>
      <div class="card">
        <b style="font-size:13px">③ 公开房间</b>
        <div style="font-size:12.5px;color:#4A5568;line-height:2;margin-top:8px">
          ${list.length ? list.map(r => `<div class="row" style="justify-content:space-between">
            <span class="mono">${esc(r.code)}</span>
            <span style="flex:1;margin:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.topic_title)}</span>
            <a style="color:#2F5BEA;cursor:pointer" onclick="joinRoom('${r.code}')">加入</a></div>`).join('')
            : '<div class="empty">现在没有公开房间</div>'}
        </div>
      </div>
    </div>`;
  }
  const room = S.room || {};
  const seats = room.seats || [];
  const r = room.room || {};
  return `
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div>
      <h1 class="pg">${esc(r.topic_title || '房间')}</h1>
      <p class="sub" style="margin:0">房间 <span class="mono">${esc(S.roomCode)}</span> · ${r.status || ''} ·
        真人 ${room.humans || 0}/8 ${room.isHost ? '· 你是房主' : ''}</p>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="copyRoom()">复制房间号</button>
      <button class="btn ghost" onclick="leaveRoom()">退出</button>
      ${room.isHost
        ? `<button class="btn primary" ${room.canStart ? '' : 'disabled'} onclick="startRoom()">开始辩论${room.canStart ? '' : `（${(room.unready||[]).length} 人未准备）`}</button>`
        : `<button class="btn primary" onclick="toggleReady()">${mySeatReady() ? '取消准备' : '准备'}</button>`}
    </div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <b style="font-size:12.5px">房间号</b>
    <span class="mono" style="margin-left:10px;font-size:16px;letter-spacing:2px;color:#2F5BEA;background:#EDF1FE;border-radius:7px;padding:3px 10px">${esc(S.roomCode)}</span>
    <span style="margin-left:12px;font-size:11.5px;color:#8A909C">队友在「多人辩论 → 房间号加入」里输入这一串</span>
  </div>
  <div class="strip">${seats.map(s => {
    const me = s.seat_key === room.mySeat;
    const label = s.occupant === 'USER' ? (s.user_name || '玩家') : s.occupant === 'AI' ? (s.user_name || 'AI') : '空位';
    return `<div class="sp ${me ? 'me' : ''}">
      <div class="av ${s.side === 'A' ? 'a' : 'b'}">${me ? '我' : label.slice(0,1)}</div>
      <div><div class="nm">${esc(label)}</div>
        <div class="rl">${s.side === 'A' ? '正方' : '反方'}${esc(s.role)}${s.ready ? ' · 已准备' : ''}</div></div>
    </div>`; }).join('')}</div>
  <div class="card">
    <b style="font-size:12.5px">席位</b>
    <table class="t" style="margin-top:8px">
      <tr><th>席位</th><th>辩位</th><th>占位</th><th>准备</th></tr>
      ${seats.map(s => `<tr>
        <td class="mono">${s.seat_key}</td><td>${esc(s.role)}</td>
        <td>${s.occupant === 'USER' ? esc(s.user_name || '玩家') + (s.seat_key === room.mySeat ? '（你）' : '')
             : s.occupant === 'AI' ? 'AI' : '<span style="color:#A8ADB8">空位（开局补 AI）</span>'}</td>
        <td>${s.occupant === 'AI' ? '<span class="tag g">就绪</span>'
             : s.ready ? '<span class="tag g">已准备</span>' : '<span class="tag">未准备</span>'}</td>
      </tr>`).join('')}
    </table>
  </div>`;
}
function mySeatReady(){
  const seats = S.room?.seats || [];
  const mine = seats.find(s => s.seat_key === S.room?.mySeat);
  return !!(mine && mine.ready);
}
async function createRoom(){
  try {
    const r = await api('/api/rooms', {method:'POST', body:{userId:S.userId, userName:'房主', topicId:S.topics[0]?.id}});
    S.roomCode = r.code; S.room = r.detail; S.mySeat = r.detail.mySeat;
    startRoomPoll(); render();
    toast('房间已创建：' + r.code);
  } catch (e) { toast('建房失败：' + e.message); }
}
async function joinRoom(code){
  const c = (code || '').trim().toUpperCase();
  if (!c) return toast('填房间号');
  try {
    S.room = await api(`/api/rooms/${c}/join`, {method:'POST', body:{userId:S.userId, userName:'玩家'}});
    S.roomCode = c; S.mySeat = S.room.mySeat;
    startRoomPoll(); render();
    toast('已加入 ' + c + ' · 你坐 ' + S.mySeat);
  } catch (e) { toast('加入失败：' + (e.message || '').slice(0, 60)); }
}
async function leaveRoom(){
  try { await api(`/api/rooms/${S.roomCode}/leave`, {method:'POST', body:{userId:S.userId}}); } catch (e) {}
  stopRoomPoll(); S.roomCode = null; S.room = null; S.mySeat = null;
  await loadRooms(); render();
}
async function toggleReady(){
  try {
    S.room = await api(`/api/rooms/${S.roomCode}/ready`, {method:'POST', body:{userId:S.userId, ready: !mySeatReady()}});
    render();
  } catch (e) { toast('操作失败：' + e.message); }
}
async function startRoom(){
  try {
    const r = await api(`/api/rooms/${S.roomCode}/start`, {method:'POST', body:{userId:S.userId}});
    stopRoomPoll();
    S.matchId = r.matchId; S.roomMode = true;
    await loadMatch(true);
    startPoll(); go('match');
  } catch (e) { toast('开局失败：' + (e.message || '').slice(0, 60)); }
}
function copyRoom(){
  try { navigator.clipboard?.writeText(S.roomCode)?.catch(()=>{}); } catch (e) {}
  toast('已复制：' + S.roomCode);
}
function startRoomPoll(){
  stopRoomPoll();
  S.roomPoll = setInterval(async () => {
    if (!S.roomCode) return;
    try {
      const d = await api(`/api/rooms/${S.roomCode}?userId=${S.userId}`);
      S.room = d;
      if (d.room && d.room.status === 'RUNNING' && d.room.match_id) {
        stopRoomPoll(); S.matchId = d.room.match_id; S.roomMode = true;
        await loadMatch(true); startPoll(); go('match'); return;
      }
      if (S.view === 'room') render();
    } catch (e) { /* 静默 */ }
  }, 1200);
}
function stopRoomPoll(){ if (S.roomPoll) { clearInterval(S.roomPoll); S.roomPoll = null; } }

/* ============ 启动 ============ */
boot();
</script>
</body>
</html>
