<!--
  批 4：入口已切到 Vue 版。

  这里只做一次跳转，保留 query 与 hash：
  · 普通访问        /            → v2/index.html#/
  · 老链接          /?v=community → v2/index.html?v=community#/ （v 会被忽略，落到首页）
  · 带定位的老链接  /#/community/12 → v2/index.html#/community/12

  旧前端（js/**、css/app.css、admin.html）已在同一批删除，所以这里没有任何脚本依赖。
-->
<script>
  (function () {
    var hash = location.hash || '#/';
    location.replace('v2/index.html' + location.search + hash);
  })();
</script>
</head>

  </div>
