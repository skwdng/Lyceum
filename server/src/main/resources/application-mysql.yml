# ============================================================================
# MySQL profile（2026-11-27 加）：`mvn spring-boot:run -Dspring-boot.run.profiles=mysql`
#
# 只覆盖两件事：数据源 + 建表脚本。其它全部从 application.yml 继承（redis / 业务参数 / 端口…）。
#
# 为什么建表只跑一个文件：application.yml 里列的 16 个 schema-*.sql 是 **H2 方言**
# （`generated by default as identity`、`create index if not exists`、`merge into … key()`），
# 在 MySQL 上会直接报语法错。MySQL 那份 42 张表由 docs/migration-mysql/schema-mysql-full.sql 提供，
# 内容与 classpath 里这份必须完全一致（改 schema 时两边一起改）。
#
# 默认 profile 仍是 H2：**不要**动 application.yml 的 datasource。
# ============================================================================
spring:
  datasource:
    # 关于时区（2026-11-27 实测踩到的）：容器里的 MySQL 是 UTC（now() 比本地慢 8 小时），
    # 而应用写进去的 java.sql.Timestamp 是本地时间 —— 两者混在一张表里就差 8 小时
    # （sy_match.started_at 来自 DB 的 default current_timestamp，deadline_at 来自应用，实测相差 8h）。
    # 所以这里除了 connectionTimeZone，还要 forceConnectionTimeZoneToSession=true：
    # 让**会话时区**也跟着变成 +08:00，DB 侧 now() 与应用侧写入才是同一个时钟。
    # 用**数字偏移**（+08:00）而不是 Asia/Shanghai：容器里没装 MySQL 时区表，
    # SET time_zone='Asia/Shanghai' 会失败；'+08:00' 不需要时区表，一定成功。
    url: jdbc:mysql://127.0.0.1:3308/siyige?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=%2B08:00&allowPublicKeyRetrieval=true&useSSL=false
    hikari:
      # 驱动层面的 forceConnectionTimeZoneToSession 在"命名时区"下会静默失败，
      # 这里直接用 Hikari 的连接初始化语句把**会话时区**钉成 +08:00（每条新连接执行一次）。
      # 目标：DB 侧的 default current_timestamp 与应用写入的 Timestamp 是同一个时钟。
      connection-init-sql: "SET time_zone = '+08:00'"
    username: ${SIYIGE_DB_USER:root}
    password: ${SIYIGE_DB_PASSWORD:siyige123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      # 建表脚本本身是幂等的（create table if not exists），但**不允许**吞错：
      # 建表失败要立刻停下来，否则后面全是「表不存在」的连锁报错，反而难查
      continue-on-error: false
      # 关键：MySQL 下只能跑 MySQL 方言那一个文件
      schema-locations: classpath:schema-mysql-full.sql

# 管理员初始账号（**开发便利，仅 mysql profile**）。
#
# 为什么需要它：H2 默认 profile 的 admin 种子写在 schema-admin.sql 里（一条 insert），
# 而 MySQL 那份 DDL 只有 42 张表、**一条 insert 都没有**（题库/论据靠 DataSeeder/EvidenceSeeder
# 启动时灌，管理端没有对应的 seeder 默认开关）。不补这一块，本机切到 MySQL 就没有管理台账号，
# 3.3 的「管理台 / 参数 / 屏蔽词 / 告警 / 报表」全验不了。
# AdminSeeder 只在「一个管理员都没有」时创建，账号密码与 H2 的种子保持一致（admin / admin123）。
siyige:
  admin:
    seed:
      enabled: true
      account: admin
      password: admin123
