# ============================================================================
# mysql profile —— 现在**只是个兼容壳**（2026-11-28 起）
#
# 历史：2026-11-27 加这个 profile，用 -Dspring-boot.run.profiles=mysql 手动指定 MySQL，
# 默认仍是 H2。2026-11-28 生产切库时，systemd 就是靠 --spring.profiles.active=mysql 切的。
#
# 现在 application.yml 的默认数据源已经是 MySQL（42 张表、时区 +08:00、schema-locations
# 指向 schema-mysql-full.sql 全都在那里），所以这个文件不再需要覆盖任何东西。
#
# 保留它的唯一原因：生产 systemd unit 里还写着 --spring.profiles.active=mysql，
# 删掉这个文件不影响启动，但留着可以让「生产参数 = 仓库可见的文件」这件事继续成立。
#
# 想改库只改 application.yml 的环境变量（SIYIGE_DB_URL / USER / PASSWORD），不要在这里重复写，
# 否则两处配置会漂移。
#
# 管理员种子也搬到了 application.yml（默认关闭，靠 SIYIGE_ADMIN_SEED 打开）——
# 原来这里写着 enabled=true + admin123，等于生产一清空 sy_admin 就会种回弱口令超管。
# ============================================================================
