<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>思弈阁 · AI 辩论训练</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#1A1D24;--sub:#6B7280;--line:#E6E3DC;--bg:#F6F4EF;--card:#fff;
    --blue:#2F5BEA;--blue-w:#EDF1FE;--org:#C2671E;--org-w:#FDF0E6;
    --grn:#0E9F6E;--grn-w:#E8F8F2;--red:#C0392B;--red-w:#FDECEA;
  }
  body{font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  button{font:inherit;border:none;cursor:pointer;background:none;color:inherit}
  input,textarea,select{font:inherit;color:inherit}
  .app{display:flex;min-height:100vh}
  /* 侧栏 */
  .sb{width:196px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:9px;padding:0 8px 16px}
  .logo .m{width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .logo b{font-size:15px;letter-spacing:.5px}
  .logo span{font-size:10px;color:var(--sub);display:block;line-height:1}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:#4A5568;font-size:13px;cursor:pointer;text-decoration:none}
  .nav a:hover{background:#F6F4EF}
  .nav a.on{background:var(--blue-w);color:var(--blue);font-weight:600}
  .nav .g{font-size:10.5px;color:#A8ADB8;padding:12px 10px 4px;letter-spacing:.5px}
  .sb .me{margin-top:auto;display:flex;align-items:center;gap:8px;padding:9px 10px;border-top:1px solid var(--line);font-size:12.5px}
  .sb .me .av{width:26px;height:26px;border-radius:7px;background:#2A2F3A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
  /* 主区 */
  main{flex:1;min-width:0;padding:24px 28px 60px}
  h1.pg{font-size:20px;margin-bottom:4px}
  p.sub{font-size:12.5px;color:var(--sub);margin-bottom:18px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border-radius:9px;padding:9px 16px;font-size:13.5px;border:1px solid transparent}
  .btn.primary{background:var(--blue);color:#fff}
  .btn.primary:hover{background:#244BCF}
  .btn.ghost{background:#fff;border-color:var(--line);color:#4A5568}
  .btn.ghost:hover{border-color:#9DB4F5;color:var(--blue)}

  .btn:disabled{opacity:.45;cursor:not-allowed}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 320px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .gauto{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .tag{font-size:11px;padding:2px 8px;border-radius:5px;background:#F1EFE9;color:#6B7280}
  .tag.b{background:var(--blue-w);color:var(--blue)} .tag.o{background:var(--org-w);color:var(--org)}
  .tag.g{background:var(--grn-w);color:var(--grn)} .tag.r{background:var(--red-w);color:var(--red)}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th{text-align:left;font-weight:600;color:var(--sub);font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
  table.t td{padding:9px 6px;border-bottom:1px solid #F3F1EB}
  table.t tr:last-child td{border-bottom:none}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  /* 辩题卡 */

  .hitem .tt{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .sp{display:flex;gap:6px;align-items:center;padding:5px 9px;border-radius:8px;background:#F6F4EF;flex-shrink:0;border:1px solid transparent}
  .sp.me{background:var(--blue-w);border-color:#B9C9F7} .sp.cur{box-shadow:0 0 0 2px var(--blue) inset}
  .sp .av{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}

  .chat{background:#FBFAF7;border:1px solid var(--line);border-radius:12px;height:460px;overflow-y:auto;padding:16px 16px 8px}
  .msg{display:flex;gap:9px;margin-bottom:13px;animation:in .22s ease}

  .msg .bd{max-width:76%} .msg.b .bd{text-align:right}
  .msg .hd{font-size:11px;color:var(--sub);margin-bottom:3px;display:flex;gap:6px}
  .msg.b .hd{justify-content:flex-end} .msg .hd b{color:#3A4150}
  .bub{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13.5px;line-height:1.75;display:inline-block;text-align:left;white-space:pre-wrap}
  .msg.me .bub{background:#2A2F3A;color:#fff;border-color:#2A2F3A}

  .sys{text-align:center;margin:9px 0 13px} .sys span{font-size:11.5px;color:var(--sub);background:#fff;border:1px dashed var(--line);border-radius:6px;padding:4px 12px}
  .caret{display:inline-block;width:2px;height:13px;background:var(--blue);vertical-align:-2px;animation:bl .8s infinite}

  .composer textarea{width:100%;min-height:66px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;background:#FCFBF8}
  .composer textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,91,234,.1)}
  .waiting{text-align:center;padding:14px;color:var(--sub);font-size:13px}
  .steps{font-size:12px;max-height:230px;overflow:auto}

  .st.done{color:#4A5568} .st.cur{color:var(--blue);font-weight:600}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:#4A5568}
  .kv b{color:var(--ink)}
  /* 雷达 */
  .radar{width:100%;max-width:340px}
  /* 结算 */
  .hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px}
  .big{font-size:48px;font-weight:800;letter-spacing:-2px;line-height:1}
  .big small{font-size:13px;font-weight:500;color:var(--sub);letter-spacing:0}
  .dim{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:6px 0}
  .dim .lb{width:40px;color:#4A5568}
  .dim .dbar{flex:1;height:6px;background:#F1EFE9;border-radius:4px;overflow:hidden}
  .dim .dbar i{display:block;height:100%;background:var(--blue);border-radius:4px}
  .ev{background:#FBFAF7;border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.85;margin-top:14px}
  .ev .k{color:var(--sub);font-size:11.5px;margin-bottom:2px}

  .mask{position:fixed;inset:0;background:rgba(20,22,28,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
  .panel{background:#fff;border-radius:16px;width:min(760px,100%);padding:22px;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.2)}
  .panel h2{font-size:17px;margin-bottom:6px} .panel .desc{font-size:12.5px;color:var(--sub);margin-bottom:16px}
  .seats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .seat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .seat{border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center;cursor:pointer;background:#FCFBF8}
  .seat:hover{border-color:#9DB4F5}
  .seat.on{background:var(--blue-w);border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,91,234,.12)}
  .seat .k{font:10.5px ui-monospace,monospace;color:var(--sub)} .seat .r{font-size:12.5px;font-weight:600} .seat .n{font-size:10.5px;color:var(--sub)}
  .presets{display:flex;gap:7px;margin:14px 0 2px;flex-wrap:wrap}
  .preset{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--sub)}
  .preset:hover{border-color:var(--blue);color:var(--blue)}
  .sum{margin-top:14px;background:#FBFAF7;border:1px dashed var(--line);border-radius:9px;padding:11px 13px;font-size:12.5px}
  .sum b{color:var(--blue)}

  #toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
  .tst{background:#20242C;color:#fff;border-radius:8px;padding:9px 16px;font-size:13px;box-shadow:0 8px 22px rgba(0,0,0,.2);animation:in .2s}
  .codebox{background:#1E222B;color:#D6DEEB;border-radius:9px;padding:12px 14px;font:12px/1.8 ui-monospace,Menlo,monospace;overflow:auto;white-space:pre}
  .codebox .c{color:#7A869A} .codebox .s{color:#9AD0A0} .codebox .k{color:#8FB8FF}
  .empty{color:#A8ADB8;font-size:12.5px;padding:22px 0;text-align:center}
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="logo"><div class="m">思</div><div><b>思弈阁</b><span>AI 辩论训练</span></div></div>

    <div class="me"><div class="av">演</div><div><div>演示用户</div><div style="font-size:11px;color:#A8ADB8">练习第 6 天</div></div></div>

<script>
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const fmt = s => { s=Math.max(0,s|0); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
function toast(msg){ const d=document.createElement('div'); d.className='tst'; d.textContent=msg; $('#toast').appendChild(d); setTimeout(()=>d.remove(),2200); }
const LS = {
  get(k,d){ try{ const v=localStorage.getItem('sy_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('sy_'+k, JSON.stringify(v)); }catch(e){} }
};

const setEl = (sel, prop, val) => { const e = document.querySelector(sel); if (e) e[prop] = val; };

/* ================= Redis ZSET 模拟 =================
   真实实现（后端 Go / Java）：
     ZINCRBY hot:debate:2026-11-01 2 topic:3
     ZREVRANGE hot:debate:2026-11-01 0 9 WITHSCORES
     ZINCRBY hot:debate:2026-11-01 -0.5 topic:3    # 衰减，定时任务每 10 分钟一次
     EXPIRE  hot:debate:2026-11-01 172800          # 保留 2 天，跨日靠合并
   本演示用内存 Map + localStorage 复刻同一套语义。 */
class ZSet {
  constructor(name){ this.name = name; this.m = new Map(LS.get('zset_'+name, [])); }
  zadd(member, score){ this.m.set(member, score); this._save(); return 1; }
  zincrby(member, delta){ const v = (this.m.get(member)||0) + delta; this.m.set(member, v); this._save(); return v; }
  zscore(member){ return this.m.get(member) || 0; }
  zcard(){ return this.m.size; }
  zrevrange(start, stop){
    const arr = [...this.m.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]));
    return arr.slice(start, stop < 0 ? undefined : stop+1);
  }
  zrank(member){ const arr = this.zrevrange(0,-1); return arr.findIndex(x=>x[0]===member); }
  _save(){ LS.set('zset_'+this.name, [...this.m.entries()]); }
}
const TODAY = new Date().toISOString().slice(0,10);
const HOTKEY = 'debate:' + TODAY;
const hot = new ZSet(HOTKEY);
const HOT_DELTA = { open:1, speech:2, finish:5, like:1, fav:3, watch:0.5 };

/* ================= 静态数据 ================= */
const SEATS = [
  {k:'A1',side:'A',role:'一辩',turns:1},{k:'A2',side:'A',role:'二辩',turns:2},
  {k:'A3',side:'A',role:'三辩',turns:2},{k:'A4',side:'A',role:'四辩',turns:1},
  {k:'B1',side:'B',role:'一辩',turns:1},{k:'B2',side:'B',role:'二辩',turns:2},
  {k:'B3',side:'B',role:'三辩',turns:2},{k:'B4',side:'B',role:'四辩',turns:1}
];
const STEPS = [
  {seg:'立论',seat:'A1',sec:180},{seg:'立论',seat:'B1',sec:180},
  {seg:'驳立论',seat:'A2',sec:120},{seg:'驳立论',seat:'B2',sec:120},
  {seg:'质询',seat:'A3',sec:120},{seg:'质询',seat:'B3',sec:120},
  {seg:'自由辩',seat:'A2',sec:120},{seg:'自由辩',seat:'B2',sec:120},
  {seg:'自由辩',seat:'A3',sec:120},{seg:'自由辩',seat:'B3',sec:120},
  {seg:'总结',seat:'B4',sec:180},{seg:'总结',seat:'A4',sec:180}
];
const AI = {A1:['沈亦舟','硬框架'],A2:['苏晚','快攻'],A3:['梁未','守中转'],A4:['许晏清','质询压迫'],
            B1:['何书言','慢热'],B2:['路知远','举例型'],B3:['陆见微','定义控'],B4:['周砚','反打']};

const TOPICS = LS.get('topics', [
  {id:1,title:'人工智能生成内容是否应当享有著作权',cat:'科技',diff:'进阶',plays:128},
  {id:2,title:'应不应该全面推行远程办公',cat:'社会',diff:'新手',plays:96},
  {id:3,title:'大数据算法推荐是否加剧了信息茧房',cat:'科技',diff:'竞赛',plays:214},
  {id:4,title:'高校是否应当取消期末考试',cat:'教育',diff:'新手',plays:302},
  {id:5,title:'公平与效率哪一个更应优先',cat:'价值',diff:'竞赛',plays:77},
  {id:6,title:'短视频对青少年的影响利大于弊',cat:'社会',diff:'进阶',plays:188},
  {id:7,title:'是否应当立法限制未成年人使用社交媒体',cat:'社会',diff:'进阶',plays:141},
  {id:8,title:'大学教育应以就业为导向还是以通识为本',cat:'教育',diff:'进阶',plays:65},
  {id:9,title:'人类是否应当主动与外星文明接触',cat:'价值',diff:'竞赛',plays:52},
  {id:10,title:'自动驾驶应当优先于公共交通发展吗',cat:'科技',diff:'竞赛',plays:88},
  {id:11,title:'考研热是理性选择还是盲目跟风',cat:'教育',diff:'新手',plays:233},
  {id:12,title:'人工智能应当拥有法律人格吗',cat:'科技',diff:'进阶',plays:167}
]);

const LINES = {
  '立论':{A:['我方立论：判断这道题要先立一个标准——可执行、可监督、可追责，三条缺一不可。',
             '我方核心主张：这件事收益是公共的，成本却集中在少数主体，整体值得推进。'],
          B:['我方先把议题拉回现实：今天讨论的不是理想状态该不该，而是此时此刻能不能。',
             '我方立场明确：这一命题在现实层面缺乏可行性，成本与收益结构性错配。']},
  '驳立论':{A:['对方一辩把「技术可行」直接推成了「制度应当」，这是从实然跳到应然。',
              '对方始终没说清成本由谁承担，只谈收益不谈分摊，论证不完整。'],
            B:['对方立的标准太宽——按它的说法，任何有试错成本的政策都不该做。',
               '对方举的例子只能说明个别地区可行，推不出普遍可复制。']},
  '质询':{A:['我请教对方：你方说的「成本过高」，具体高在哪个科目？没有口径，这就只是印象。',
             '我想追问：按你方的标准，现有制度里有几项能通过？'],
          B:['我请教对方一辩：你说的「可行」，是实验室可行还是大规模推行可行？',
             '对方一直在谈原则，我想问：执行主体是谁？出了问题向谁追责？']},
  '自由辩':{A:['对方把风险直接推成了禁止——风险存在只支持「应当规范」，支撑不到「不应推进」。',
               '对方至今没有回应成本分摊的问题，我请对方正面回答。'],
            B:['对方说我方只会否定，但我方给了替代路径：先试点、再评估、后铺开。',
               '对方刚才那句是循环论证——用结论来证明结论。']},
  '总结':{A:['整场下来，对方始终回避成本由谁承担。我方结论：值得做，但要按可监督的路径做。',
             '三个分歧收一下：标准、成本、执行。前两个对方没答，第三个答错了。'],
          B:['我方结辩：对方没有拿出任何一期执行评估。在评估缺位时不应全面推进。',
             '真正的分歧不在该不该，而在能不能——这一点我方从立论守到现在。']}
};

/* 初始热度：模拟历史累积 */
if (hot.zcard() === 0) {
  hot.zadd('1', 86); hot.zadd('4', 152); hot.zadd('11', 121);
  hot.zadd('3', 178); hot.zadd('6', 97); hot.zadd('12', 64);
  hot.zadd('7', 73); hot.zadd('2', 41); hot.zadd('10', 55); hot.zadd('5', 33);
}

/* ---------- 辩题 AI 审核 ---------- */
const AUDIT_CACHE = new Map(Object.entries(LS.get('audit', {})));
const AUDIT_BLACK = /(傻|智障|去死|色情|裸|辱骂|恶心|滚)/;
const AUDIT_ABSOLUTE = /(绝对|永远|一定|所有|必然)/;
const AUDIT_STANCE = /(是否|该不该|应不应该|应当|利大于弊|弊大于利|优于|取代|取消|禁止|合法|值得)/;

function judgeTopic(t){
  const s = t.trim();
  if (s.length < 6) return {result:'NEED_EDIT', reason:'少于 6 个字，凑不成一个可判断的命题',
    suggestions:['应不应该全面推行远程办公','高校是否应当取消期末考试']};
  if (AUDIT_BLACK.test(s)) return {result:'REJECT', reason:'含人身攻击或违规表述，不能作为辩题',
    suggestions:['网络匿名是否应当被限制','平台对极端言论的责任边界在哪']};
  if (!AUDIT_STANCE.test(s)) return {result:'NEED_EDIT', reason:'没有明确的正反立场，无法分正反方',
    suggestions:[s+'是否应当被推广', s+'利大于弊还是弊大于利']};
  if (AUDIT_ABSOLUTE.test(s)) return {result:'NEED_EDIT', reason:'含「所有/永远/一定」这类绝对表述，正反方无法公平论证',
    suggestions:[s.replace(AUDIT_ABSOLUTE,'通常'), s+'在现实条件下是否可行']};
  return {result:'PASS', reason:'存在正反两种合理立场，边界清晰，可以开辩', suggestions:[]};
}
function auditTopic(title){
  const key = title.trim();
  if (AUDIT_CACHE.has(key)) return Promise.resolve({...AUDIT_CACHE.get(key), cached:true});
  return new Promise(res=>{
    setTimeout(()=>{
      const r = judgeTopic(key);
      AUDIT_CACHE.set(key, r);
      LS.set('audit', Object.fromEntries(AUDIT_CACHE));
      res({...r, cached:false});
    }, 700 + Math.random()*600);   // 模拟模型往返；真实实现 ≤3s
  });
}
async function useCustomTopic(){
  const el = $('#customTopic');
  const title = (el?.value || '').trim();
  if (!title) return toast('先写一个辩题');
  showAudit(title, {state:'checking'});
  const r = await auditTopic(title);
  showAudit(title, {state:'done', ...r});
}
function showAudit(title, r){
  document.querySelectorAll('#auditMask').forEach(m=>m.remove());
  const m = document.createElement('div');
  m.className = 'mask'; m.id = 'auditMask';
  const checking = r.state === 'checking';
  const pass = r.result === 'PASS';
  const icon = checking ? '⏳' : pass ? '✅' : r.result === 'REJECT' ? '⛔' : '✏️';
  const color = checking ? '#8A909C' : pass ? '#0E9F6E' : r.result === 'REJECT' ? '#C0392B' : '#C2671E';
  m.innerHTML = `
    <div class="panel" style="width:min(560px,100%)">
      <div class="row" style="gap:10px;margin-bottom:6px">
        <span style="font-size:22px">${icon}</span>
        <h2 style="margin:0;color:${color}">${checking?'AI 审核中…': pass?'审核通过':'需要修改'}</h2>
        ${r.cached?'<span class="tag">命中缓存</span>':''}
      </div>
      <div class="desc" style="margin-bottom:12px">「${esc(title)}」</div>
      ${checking ? `
        <div class="sum">正在判断：是否可辩 · 正反是否平衡 · 边界是否清晰 · 是否合规</div>
        <div class="row" style="justify-content:flex-end;margin-top:16px">
          <button class="btn ghost" onclick="document.querySelectorAll('#auditMask').forEach(m=>m.remove())">取消</button>
        </div>` : `
        <div class="sum" style="background:${pass?'#E8F8F2':'#FBFAF7'};border-style:solid;border-color:${pass?'#BFE9D8':'#E6E3DC'}">
          <b>结论：</b>${esc(r.reason)}
        </div>
        ${r.suggestions && r.suggestions.length ? `
          <div style="margin-top:12px;font-size:12.5px;color:#6B7280">试试这些改写：</div>
          ${r.suggestions.map(s=>`<div class="row" style="margin-top:6px">
            <span style="flex:1;font-size:13px">${esc(s)}</span>
            <button class="btn sm ghost" onclick="adoptTopic('${esc(s).replace(/'/g,'')}')">用这个</button>
          </div>`).join('')}` : ''}
        <div class="row" style="justify-content:flex-end;margin-top:16px">
          <button class="btn ghost" onclick="document.querySelectorAll('#auditMask').forEach(m=>m.remove())">关闭</button>
          ${pass ? `<button class="btn primary" onclick="confirmCustomTopic()">选位置 →</button>`
                 : `<button class="btn primary" onclick="document.querySelectorAll('#auditMask').forEach(m=>m.remove());document.querySelector('#customTopic').focus()">修改后再审</button>`}
        </div>`}
    </div>`;
  $('#modalHost').appendChild(m);
  S.pendingTopic = title;
}
function adoptTopic(t){ const el=$('#customTopic'); if(el) el.value=t; useCustomTopic(); }
function confirmCustomTopic(){
  document.querySelectorAll('#auditMask').forEach(m=>m.remove());
  const t = {id:'c'+Date.now(), title:S.pendingTopic, cat:'自定义', diff:'进阶', plays:0, custom:true, audited:true};
  S.topic = t;
  openSeatPanel(t);
}
function hotRow(id, sc, i, delta){
  const t = TOPICS.find(x=>String(x.id)===String(id)) || {title:'（已删除）'};
  const cls = i===0?'top1':i===1?'top2':i===2?'top3':'';
  const d = delta===null ? '<span class="flat">—</span>'
          : delta>0 ? `<span class="up">▲${delta}</span>`
          : delta<0 ? `<span class="down">▼${Math.abs(delta)}</span>` : '<span class="flat">—</span>';
  return `<div class="hitem ${cls}" onclick="openSeatPanel(${t.id||0})">
    <div class="rk">${i+1}</div>
    <div style="flex:1;min-width:0">
      <div class="tt">${esc(t.title)}</div>
      <div class="heatbar"><i style="width:${Math.min(100, sc/2)}%"></i></div>
    </div>
    <div class="sc">${sc.toFixed(1)}</div><div class="dl">${d}</div>
  </div>`;
}

function afterMatchRender(){ renderStrip(null); renderSteps(); }
async function runMatch(){
  sys(`辩题：${S.topic.title} · 你占 ${S.mySeats.join('、')}`);
  const n = STEPS.filter(st=>S.mySeats.includes(st.seat)).length;
  sys(`本场你共发言 ${n} 次 · 其余席位由 AI 补齐`);
  await preparePhase();
  for (S.step=0; S.step<STEPS.length; S.step++){
    if (!S.running) return;
    const st = STEPS[S.step], seat = SEATS.find(s=>s.k===st.seat);
    renderStrip(st.seat); renderSteps();
    setEl('#mStep','textContent',`${S.step+1} / 12`);
    if (S.readonly || !S.mySeats.includes(st.seat)) await aiTurn(st, seat);
    else await myTurn(st, seat);
    if (!S.running) return;
  }
  finishMatch(false);
}
async function preparePhase(){
  setEl('#composerBody','innerHTML',`<div class="waiting">10 秒准备期 · 请整理你的<b style="color:#2F5BEA">立论</b></div>`);
  for (let i=10;i>0;i--){
    if (!S.running) return;
    setEl('#cHint','textContent',`准备期 ${i}s`);
    setEl('#mTimer','textContent',fmt(i));
    await sleep(1000/S.pace);
  }
  setEl('#composerBody','innerHTML','');
}
async function aiTurn(st, seat){
  const name = AI[st.seat][0];
  sys(`${seat.role} ${name} 正在思考…`);
  setEl('#cHint','textContent',`${name} 正在思考…`);
  setEl('#composerBody','innerHTML',`<div class="waiting">对方正在思考…</div>`);
  setEl('#cRight','innerHTML',`<button class="btn sm ghost" onclick="skipAI()">跳过这段</button>`);
  S._skip = false;
  const think = (1800 + Math.random()*1400) / S.pace;
  const t0 = Date.now();
  while (Date.now()-t0 < think) { if (S._skip) break; await sleep(50); }
  if (S._skip) { addMsg(st.seat,name,st.seg,seat.role,'（已跳过，摘要：'+LINES[st.seg][seat.side][0].slice(0,26)+'…）',true); }
  else {
    const pool = LINES[st.seg][seat.side];
    await typeOut(st.seat,name,st.seg,seat.role,pool[Math.floor(Math.random()*pool.length)]);
  }
  setEl('#cRight','innerHTML',''); setEl('#composerBody','innerHTML','');
  await sleep(2500/S.pace);
}
function skipAI(){ S._skip = true; S.skipped++; const e=$('#sSkip'); if(e) e.textContent=S.skipped; }
async function typeOut(k,name,seg,role,text){
  const el = addMsg(k,name,seg,role,'',false,true);
  setEl('#cHint','textContent',`${name} 正在发言…`);
  const cps = (8+Math.random()*4)*S.pace;
  for (let i=1;i<=text.length;i++){
    const t = el.querySelector('.txt'); if(t) t.textContent = text.slice(0,i);
    if ('。！？'.includes(text[i-1])) await sleep(360/S.pace);
    await sleep(1000/cps);
    const c=$('#chat'); if(c) c.scrollTop = c.scrollHeight;
  }
}
async function myTurn(st, seat){
  setEl('#cHint','textContent',`轮到你（${seat.role}）· ${st.seg}`);
  setEl('#cRight','textContent','');
  setEl('#composerBody','innerHTML',`
    <textarea id="inp" placeholder="写下你的${st.seg}…（也可点录音看转写）"></textarea>

      <button class="btn sm primary" onclick="mySend()">发送</button>

/* ================= 6. 结算 / 复盘 ================= */
function finishMatch(manual){
  stopMatch();
  const len = S.myLines.join('').replace(/\s/g,'').length;
  const dims = {
    立论: Math.max(45, Math.min(92, 55+Math.round(len/12))),
    论证: Math.max(42, Math.min(90, 52+Math.round(len/14))),
    表达: Math.max(50, Math.min(90, 60+Math.round(len/20))),
    应变: Math.max(40, Math.min(88, 48+Math.round(len/18))),
    论据: Math.max(40, Math.min(88, 45+Math.round(len/22)))
  };
  const total = Math.round(dims.立论*0.4 + dims.论证*0.35 + dims.表达*0.25);
  S.lastReview = {total, dims, turns:S.turns, skipped:S.skipped, lines:S.myLines.slice(), topic:S.topic, seats:[...S.mySeats]};

  // 写记录
  S.records.unshift({
    id:'r'+Date.now(), topic:S.topic.title, seats:[...S.mySeats], side:S.mySeats[0][0]==='A'?'正方':'反方',
    total, turns:S.turns, date:new Date().toLocaleString('zh-CN',{hour12:false}).slice(0,16), dims
  });
  if (S.records.length>50) S.records.pop();
  // 合并到画像
  Object.keys(dims).forEach(k=>{
    S.diag.dims[k] = Math.round((S.diag.dims[k]*0.8) + (dims[k]*0.2));
  });
  persist();
  hot.zincrby(String(S.topic.id), HOT_DELTA.finish + HOT_DELTA.speech*S.turns);

  S.view='review'; render();
}

/* ================= 7. 能力诊断 ================= */
function radarSVG(dims){
  const keys = Object.keys(dims), n = keys.length, R = 84, cx = 120, cy = 120;
  const pts = keys.map((k,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/n;
    const r = R * (dims[k]/100);
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  });
  const outer = keys.map((k,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/n;
    return [cx + R*Math.cos(a), cy + R*Math.sin(a)];
  });
  const poly = pts.map(p=>p.join(',')).join(' ');
  return `<svg class="radar" viewBox="0 0 240 240">
    ${[0.25,0.5,0.75,1].map(f=>`<polygon points="${outer.map(([x,y])=>[cx+(x-cx)*f, cy+(y-cy)*f].join(',')).join(' ')}"
        fill="none" stroke="#EDEAE3"/>`).join('')}
    ${outer.map(([x,y])=>`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#EDEAE3"/>`).join('')}
    <polygon points="${poly}" fill="rgba(47,91,234,.18)" stroke="#2F5BEA" stroke-width="2"/>
    ${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="#2F5BEA"/>`).join('')}
    ${keys.map((k,i)=>{
      const a = -Math.PI/2 + i*2*Math.PI/n;
      const x = cx + (R+20)*Math.cos(a), y = cy + (R+20)*Math.sin(a);
      return `<text x="${x}" y="${y}" font-size="10" fill="#6B7280" text-anchor="middle" dominant-baseline="middle">${k}</text>`;
    }).join('')}
  </svg>`;
}
function viewDiag(){
  const d = S.diag;
  const flaws = Object.entries(d.flaws).sort((a,b)=>b[1]-a[1]);
  return `
  <h1 class="pg">能力诊断</h1>
  <p class="sub">只和你自己比：看趋势、看漏洞频次，没有段位，也没有排名。</p>
  <div class="grid g2">
    <div class="card">
      <b style="font-size:13px">五维画像</b>
      <div class="row" style="align-items:center;margin-top:6px">
        <div style="flex:1;min-width:240px">${radarSVG(d.dims)}</div>
        <div style="flex:1;min-width:180px">
          ${Object.entries(d.dims).map(([k,v])=>`<div class="dim"><span class="lb">${k}</span>
            <div class="dbar"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join('')}
        </div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><b style="font-size:13px">练习连续性</b>
          <span class="tag g">连续 ${d.streak} 天</span></div>
        <div style="font-size:12px;color:#8A909C;margin-top:8px">中断即归零，不和别人比。</div>
        <div class="row" style="margin-top:10px">
          ${Array.from({length:14},(_,i)=>`<div style="width:14px;height:14px;border-radius:3px;background:${i<d.streak?'#2F5BEA':'#EDEAE3'}"></div>`).join('')}
        </div>
      </div>
      <div class="card" style="margin-top:12px">
        <b style="font-size:13px">漏洞统计（错题本）</b>
        <table class="t" style="margin-top:6px">
          ${flaws.map(([k,v])=>`<tr><td>${k}</td><td class="mono" style="text-align:right">${v} 次</td>
            <td style="width:70px"><button class="btn sm ghost" onclick="go('room')">去练</button></td></tr>`).join('')}
        </table>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <b style="font-size:13px">建议下一步</b>
    <div style="font-size:13px;color:#4A5568;line-height:1.9;margin-top:6px">
      你的 <b>论据</b> 维度最低（${d.dims.论据}）。建议做 3 轮「质询」专练：每轮逼对方给出可核查口径，
      并在自己发言里至少引用 1 条带出处的论据。
    </div>
    <button class="btn primary" style="margin-top:10px" onclick="toast('专练已排入队列（演示）')">开始专练</button>
  </div>`;
}

/* ================= 8. 辩论记录 ================= */
function viewRecords(){
  const rs = S.records;
  return `
  <h1 class="pg">辩论记录</h1>
  <p class="sub">没有段位、没有排名。只记录你打过什么。</p>
  <div class="grid g3" style="margin-bottom:14px">
    <div class="card"><div style="font-size:12px;color:#8A909C">总场次</div><div class="big" style="font-size:30px">${rs.length}</div></div>
    <div class="card"><div style="font-size:12px;color:#8A909C">平均分</div><div class="big" style="font-size:30px">${rs.length?Math.round(rs.reduce((a,b)=>a+b.total,0)/rs.length):'—'}</div></div>
    <div class="card"><div style="font-size:12px;color:#8A909C">总发言回合</div><div class="big" style="font-size:30px">${rs.reduce((a,b)=>a+b.turns,0)}</div></div>
  </div>
  <div class="card">
    ${rs.length ? `<table class="t">
      <tr><th>时间</th><th>辩题</th><th>席位</th><th>发言</th><th>得分</th><th></th></tr>
      ${rs.map(r=>`<tr>
        <td style="font-size:12px;color:#8A909C">${r.date}</td>
        <td>${esc(r.topic)}</td><td class="mono">${r.seats.join(' ')}</td>
        <td class="mono">${r.turns}</td><td><b>${r.total}</b></td>
        <td><button class="btn sm ghost" onclick="replayReview('${r.id}')">看复盘</button></td>
      </tr>`).join('')}
    </table>` : `<div class="empty">还没有记录，去大厅开一场吧</div>`}
  </div>`;
}
function replayReview(id){
  const r = S.records.find(x=>x.id===id); if(!r) return;
  S.lastReview = {total:r.total, dims:r.dims, turns:r.turns, skipped:0, lines:['（历史记录，仅存分数）'], topic:{title:r.topic}, seats:r.seats};
  S.view='review'; render();
}

/* ================= 9. 社区 ================= */
function viewCommunity(){
  return `
  <h1 class="pg">讨论社区</h1>
  <p class="sub">发帖讨论打法；点赞只影响「热度」，不进入任何评分。</p>
  <div class="grid g2">
    <div class="card">
      ${S.posts.map(p=>`
        <div style="padding:12px 0;border-bottom:1px solid #F3F1EB">
          <div class="row" style="justify-content:space-between">
            <b style="font-size:13.5px">${esc(p.t)}</b>
            <span class="tag ${p.c==='教程'?'g':p.c==='求助'?'o':''}">${p.c}</span>
          </div>
          <div style="font-size:12.5px;color:#6B7280;margin:5px 0 7px;line-height:1.7">${esc(p.body.slice(0,72))}…</div>
          <div class="row" style="font-size:11.5px;color:#8A909C">
            <span>@${esc(p.u)}</span><span>·</span><span>👍 ${p.likes}</span><span>·</span><span>💬 ${p.replies}</span>
            <span style="margin-left:auto"><button class="btn sm ghost" onclick="likePost('${p.id}')">点赞 +热度</button></span>
          </div>
        </div>`).join('')}
    </div>
    <div class="card">
      <b style="font-size:13px">发新帖</b>
      <input class="btn ghost" id="pTitle" style="width:100%;margin:10px 0;text-align:left;padding:8px 12px" placeholder="标题">
      <textarea class="btn ghost" id="pBody" style="width:100%;height:90px;text-align:left;padding:9px 12px;resize:vertical" placeholder="正文…"></textarea>
      <button class="btn primary" style="width:100%;margin-top:10px" onclick="newPost()">发布</button>
      <div style="font-size:11.5px;color:#8A909C;margin-top:10px;line-height:1.7">
        点赞会让帖子的热度上升，但 <b>不会</b> 影响任何人的辩论分数（规格 R-TECH-17）。
      </div>
    </div>
  </div>`;
}
function likePost(id){
  const p = S.posts.find(x=>x.id===id); if(!p) return;
  p.likes++; LS.set('posts',S.posts); toast('已点赞（热度 +1）'); render();
}
function newPost(){
  const t = $('#pTitle').value.trim(), b = $('#pBody').value.trim();
  if (!t || !b) return toast('标题和正文都要写');
  S.posts.unshift({id:'p'+Date.now(), u:'演示用户', t, c:'闲聊', body:b, likes:0, replies:0});
  LS.set('posts',S.posts); toast('已发布'); render();
}

/* ================= 启动 ================= */
render();
window.APP = { go, openSeatPanel, startMatch, finishMatch, S, hot, HOTKEY };
</script>
