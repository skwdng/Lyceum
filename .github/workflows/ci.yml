name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 · 编译 + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 编译 + 全部单测
        run: mvn -f server/pom.xml -B test
      - name: 覆盖率（JaCoCo，核心模块需 ≥60%）
        run: mvn -f server/pom.xml -B jacoco:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: server/target/surefire-reports/

  frontend:
    name: 前端 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装依赖
        working-directory: web
        run: npm ci || npm install
      - name: 构建（产物进 server/src/main/resources/static/v2）
        working-directory: web
        run: npm run build
      - name: 产物存在性检查（防止构建静默失败）
        run: test -f server/src/main/resources/static/v2/index.html && echo "v2/index.html ok"

  smoke:
    name: 冒烟 · 起服务跑健康检查
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 打包
        run: mvn -f server/pom.xml -B package -DskipTests
      - name: 启动并探活（H2 内存库，不依赖外部服务）
        run: |
          java -jar server/target/siyige-backend-0.1.0.jar --server.port=18080 \
            --siyige.redis.enabled=false --siyige.llm.speech-enabled=false &
          for i in $(seq 1 60); do
            sleep 2
            if curl -sf http://127.0.0.1:18080/api/health; then echo "healthy"; exit 0; fi
          done
          echo "服务没起来"; exit 1
